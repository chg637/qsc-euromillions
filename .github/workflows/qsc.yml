name: QSC EuroMillions — tirage du jour

on:
  schedule:
    # Mardi et vendredi. GitHub traite les crons "best effort" : un créneau peut être
    # sauté (02/10/2026) ou, plus souvent, très en retard : sur les runs d'octobre et
    # novembre 2026, les créneaux de 06:10 UTC sont partis entre 5 h et 8 h trop tard
    # (06/11/2026 : rien à midi, heure de la lecture Cowork).
    # D'où des créneaux placés la veille au soir et en pleine nuit, à des minutes creuses
    # (:23, :37) pour que le premier à partir livre avant 12:00 Paris. Les suivants,
    # y compris les anciens créneaux conservés en rattrapage, constatent que latest.json
    # porte déjà la bonne draw_date et s'arrêtent (garde d'idempotence ci-dessous).
    - cron: "23 22 * * 1,4"   # veille au soir (lundi/jeudi) pour le tirage du lendemain
    - cron: "37 2 * * 2,5"    # nuit du jour de tirage
    - cron: "10 6 * * 2,5"    # 08:10 Paris (été) / 07:10 (hiver)
    - cron: "10 9 * * 2,5"    # rattrapage n°1
    - cron: "40 12 * * 2,5"   # rattrapage n°2
  workflow_dispatch:
    inputs:
      jackpot_meur:
        description: "Jackpot officiel du prochain tirage en M€ (vide = estimation API)"
        required: false
        default: ""
      n_grilles:
        description: "Plancher du nombre de grilles (vide = règle jackpot seule). Ne peut que relever le nombre, jamais le réduire."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: qsc
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Garde d'idempotence : n'agit que sur les déclenchements planifiés.
      # Un workflow_dispatch manuel force toujours le recalcul (p. ex. jackpot officiel).
      - name: Run du jour déjà publié ?
        id: guard
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import datetime, json
          import qsc_v40 as q
          want = q.next_draw_date(datetime.date.today()).isoformat()
          try:
              L = json.load(open("output/latest.json", encoding="utf-8"))
              have = L["draw_date"]
          except Exception:
              L, have = {}, None
          # v4.1 : un run publié en mode dégradé (jackpot estimé ou dataset en retard) n'est pas
          # définitif. Les créneaux suivants le rejouent jusqu'à 10:00 UTC, soit avant la lecture
          # de midi ; les grilles déjà inscrites au registre sont figées, seul le complément change.
          # Après 10:00 UTC on ne touche plus à rien : aucune grille ajoutée après la restitution.
          propre = (L.get("jackpot", {}).get("source") in ("fdj.fr", "fourni")
                    and not L.get("dataset", {}).get("retard_tirages", 0))
          tard = datetime.datetime.utcnow().hour >= 10
          done = have == want and (propre or tard)
          print(f"want={want}")
          print(f"have={have}")
          print(f"propre={str(propre).lower()}")
          print("done=" + ("true" if done else "false"))
          PY

      - name: Rien à faire
        if: github.event_name == 'schedule' && steps.guard.outputs.done == 'true'
        run: echo "latest.json porte déjà le tirage ${{ steps.guard.outputs.want }} — créneau de rattrapage sans objet."

      - name: Tests unitaires
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        run: python3 test_qsc_v40.py

      # v4.1 : non bloquant. API injoignable (code 2) ou tirage manquant côté API (code 3) :
      # le pipeline tourne quand même sur le CSV existant et l'écrit en alerte dans le livrable.
      - name: Refresh CSV depuis l'API
        id: refresh
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        continue-on-error: true
        run: python3 update_master.py

      - name: Pipeline QSC (rapport, registre, checklist)
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        env:
          JACKPOT_MEUR: ${{ github.event.inputs.jackpot_meur }}
          N_GRILLES: ${{ github.event.inputs.n_grilles }}
          UPDATE_STATUS: ${{ steps.refresh.outcome }}
        run: python3 run_qsc.py

      - name: Commit des résultats
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        run: |
          git config user.name "qsc-bot"
          git config user.email "qsc-bot@users.noreply.github.com"
          git add euromillions_MASTER.csv euromillions_PRIZES.csv output/
          if git diff --cached --quiet; then
            echo "rien à committer"
          else
            git commit -m "QSC run $(date -u +%F) — $(python3 -c "import json;d=json.load(open('output/latest.json'));print('tirage',d['draw_date'],'·',d['dataset']['n'],'tirages')")"
            git pull --rebase --quiet
            git push
          fi

      # Trace visible dans l'onglet Actions quand un run planifié échoue :
      # le job apparaît en rouge et le résumé dit quoi relancer.
      - name: Résumé d'échec
        if: failure()
        run: |
          {
            echo "## Run QSC en échec"
            echo ""
            echo "Tirage visé : \`${{ steps.guard.outputs.want }}\` · dernier publié : \`${{ steps.guard.outputs.have }}\`"
            echo ""
            echo "Relancer à la main : onglet **Actions → QSC EuroMillions — tirage du jour → Run workflow**."
          } >> "$GITHUB_STEP_SUMMARY"
