name: QSC EuroMillions — tirage du jour

on:
  schedule:
    # Mardi et vendredi. GitHub traite les crons "best effort" : un créneau peut être
    # purement et simplement sauté en cas de charge (c'est ce qui est arrivé le 02/10/2026).
    # Trois créneaux + garde d'idempotence : le premier qui tourne fait le travail,
    # les suivants constatent que latest.json porte déjà la bonne draw_date et s'arrêtent.
    - cron: "10 6 * * 2,5"    # 08:10 Paris (été) / 07:10 (hiver)
    - cron: "10 9 * * 2,5"    # rattrapage n°1
    - cron: "40 12 * * 2,5"   # rattrapage n°2 — après la lecture Cowork de 12:00 Paris
  workflow_dispatch:
    inputs:
      jackpot_meur:
        description: "Jackpot officiel du prochain tirage en M€ (vide = estimation API)"
        required: false
        default: ""
      n_grilles:
        description: "Plancher du nombre de grilles (vide = règle jackpot seule). Ne peut que relever le nombre, jamais le réduire."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: qsc
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Garde d'idempotence : n'agit que sur les déclenchements planifiés.
      # Un workflow_dispatch manuel force toujours le recalcul (p. ex. jackpot officiel).
      - name: Run du jour déjà publié ?
        id: guard
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import datetime, json
          import qsc_v39 as q
          want = q.next_draw_date(datetime.date.today()).isoformat()
          try:
              have = json.load(open("output/latest.json", encoding="utf-8"))["draw_date"]
          except Exception:
              have = None
          print(f"want={want}")
          print(f"have={have}")
          print("done=" + ("true" if have == want else "false"))
          PY

      - name: Rien à faire
        if: github.event_name == 'schedule' && steps.guard.outputs.done == 'true'
        run: echo "latest.json porte déjà le tirage ${{ steps.guard.outputs.want }} — créneau de rattrapage sans objet."

      - name: Tests unitaires
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        run: python3 test_qsc_v39.py

      - name: Refresh CSV depuis l'API
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        run: python3 update_master.py

      - name: Pipeline QSC (rapport, registre, checklist)
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        env:
          JACKPOT_MEUR: ${{ github.event.inputs.jackpot_meur }}
          N_GRILLES: ${{ github.event.inputs.n_grilles }}
        run: python3 run_qsc.py

      - name: Commit des résultats
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        run: |
          git config user.name "qsc-bot"
          git config user.email "qsc-bot@users.noreply.github.com"
          git add euromillions_MASTER.csv euromillions_PRIZES.csv output/
          if git diff --cached --quiet; then
            echo "rien à committer"
          else
            git commit -m "QSC run $(date -u +%F) — $(python3 -c "import json;d=json.load(open('output/latest.json'));print('tirage',d['draw_date'],'·',d['dataset']['n'],'tirages')")"
            git push
          fi

      # Trace visible dans l'onglet Actions quand un run planifié échoue :
      # le job apparaît en rouge et le résumé dit quoi relancer.
      - name: Résumé d'échec
        if: failure()
        run: |
          {
            echo "## Run QSC en échec"
            echo ""
            echo "Tirage visé : \`${{ steps.guard.outputs.want }}\` · dernier publié : \`${{ steps.guard.outputs.have }}\`"
            echo ""
            echo "Relancer à la main : onglet **Actions → QSC EuroMillions — tirage du jour → Run workflow**."
          } >> "$GITHUB_STEP_SUMMARY"
