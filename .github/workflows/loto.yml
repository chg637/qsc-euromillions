name: QSC Loto — tirage du jour

on:
  schedule:
    # Lundi, mercredi, samedi. Réactivé le 07/11/2026 avec le module Loto v2.0 (aligné sur la v4.0 de
    # l'EuroMillions : tirage uniforme, 1 grille, budget commun). Même logique de créneaux que qsc.yml :
    # les crons GitHub sont « best effort » et partent parfois 5 à 8 h trop tard, d'où un créneau la
    # veille au soir et un en pleine nuit, à des minutes creuses, pour livrer avant la lecture Cowork
    # de 11:49 Paris. Les suivants constatent que latest.json porte déjà la bonne draw_date et
    # s'arrêtent (garde d'idempotence ci-dessous).
    - cron: "29 22 * * 0,2,5"   # veille au soir (dimanche/mardi/vendredi) pour le tirage du lendemain
    - cron: "43 2 * * 1,3,6"    # nuit du jour de tirage
    - cron: "20 6 * * 1,3,6"    # 08:20 Paris (été) / 07:20 (hiver)
    - cron: "20 9 * * 1,3,6"    # rattrapage n°1
    - cron: "50 12 * * 1,3,6"   # rattrapage n°2
  workflow_dispatch:
    inputs:
      jackpot_meur:
        description: "Jackpot officiel du prochain tirage en M€ (vide = lu sur fdj.fr, repli estimation)"
        required: false
        default: ""
      n_grilles:
        description: "Plancher du nombre de grilles (vide = règle jackpot seule). Ne peut que relever le nombre, jamais le réduire."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: qsc-loto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: loto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run du jour déjà publié ?
        id: guard
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import datetime, json
          import qsc_loto as q
          want = q.next_draw_date(datetime.date.today()).isoformat()
          try:
              L = json.load(open("output/latest.json", encoding="utf-8"))
              have = L["draw_date"]
          except Exception:
              L, have = {}, None
          # v2.1 : un run publié en mode dégradé (jackpot estimé ou dataset en retard) n'est pas
          # définitif. Les créneaux suivants le rejouent jusqu'à 10:00 UTC, soit avant la lecture
          # de 11:49 Paris ; les grilles déjà inscrites au registre sont figées.
          propre = (L.get("jackpot", {}).get("source") in ("fdj.fr", "fourni")
                    and not L.get("dataset", {}).get("retard_tirages", 0))
          tard = datetime.datetime.utcnow().hour >= 10
          done = have == want and (propre or tard)
          print(f"want={want}")
          print(f"have={have}")
          print(f"propre={str(propre).lower()}")
          print("done=" + ("true" if done else "false"))
          PY

      - name: Rien à faire
        if: github.event_name == 'schedule' && steps.guard.outputs.done == 'true'
        run: echo "latest.json porte déjà le tirage ${{ steps.guard.outputs.want }}."

      - name: Tests unitaires
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        run: python3 test_loto.py

      # v2.1 : non bloquant. FDJ injoignable (code 2) ou tirage manquant (code 3) : le pipeline
      # tourne quand même sur le CSV existant et l'écrit en alerte dans le livrable.
      - name: Refresh CSV depuis la FDJ
        id: refresh
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        continue-on-error: true
        run: python3 update_loto.py

      - name: Pipeline QSC Loto
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        env:
          JACKPOT_MEUR: ${{ github.event.inputs.jackpot_meur }}
          N_GRILLES: ${{ github.event.inputs.n_grilles }}
          UPDATE_STATUS: ${{ steps.refresh.outcome }}
        run: python3 run_loto.py

      - name: Commit des résultats
        if: github.event_name != 'schedule' || steps.guard.outputs.done != 'true'
        run: |
          git config user.name "qsc-bot"
          git config user.email "qsc-bot@users.noreply.github.com"
          git add loto_MASTER.csv loto_PRIZES.csv output/
          if git diff --cached --quiet; then
            echo "rien à committer"
          else
            git commit -m "QSC Loto run $(date -u +%F) — $(python3 -c "import json;d=json.load(open('output/latest.json'));print('tirage',d['draw_date'],'·',d['dataset']['n'],'tirages')")"
            git pull --rebase --quiet
            git push
          fi

      - name: Résumé d'échec
        if: failure()
        run: |
          {
            echo "## Run QSC Loto en échec"
            echo "Tirage visé : \`${{ steps.guard.outputs.want }}\` · dernier publié : \`${{ steps.guard.outputs.have }}\`"
            echo "Relancer : Actions → QSC Loto — tirage du jour → Run workflow."
          } >> "$GITHUB_STEP_SUMMARY"
