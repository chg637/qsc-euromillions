name: Tests

# Filet de sécurité sur les PR vers main. Indépendant des workflows de production
# (qsc.yml, loto.yml) : ne commit rien, ne touche ni au registre ni aux sorties.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: EuroMillions
        run: python3 test_qsc_v40.py
      - name: Loto
        working-directory: loto
        run: python3 test_loto.py
      - name: Golden (rejeu à l'identique sur données figées)
        run: python3 tests/test_golden.py
