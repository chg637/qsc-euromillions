name: QSC — recalibrage mensuel de la popularité

on:
  schedule:
    - cron: "20 5 1 * *"     # le 1er du mois, 07:20 Paris (été)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qsc
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: Gagnants par rang → table de popularité
        run: python3 fit_popularity.py
      - name: Tests (la table doit rester cohérente)
        run: python3 test_qsc_v39.py
      - name: Commit
        run: |
          git config user.name "qsc-bot"
          git config user.email "qsc-bot@users.noreply.github.com"
          git add winners_MASTER.csv popularity_fdj.json
          if git diff --cached --quiet; then echo "rien à committer"; else
            git commit -m "QSC popularité — recalibrage $(date -u +%F)" && git push; fi
